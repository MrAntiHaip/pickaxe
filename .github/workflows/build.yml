name: Build Minecraft Fabric 1.20.1 Mod (.JAR)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mod Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin) for Minecraft 1.20.1
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Fabric 1.20.1 Mod JAR
        run: gradle build --no-daemon

      - name: Upload Ready-to-Play Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dima-ulyana-story-mod-1.20.1-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
